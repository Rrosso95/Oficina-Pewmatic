<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina Pewmatic</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%238b6cff'/%3E%3Crect x='2' y='2' width='4' height='4' fill='%23f2c230'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0e1c; --panel:#141731; --panel2:#1b1f42; --line:#2a2f5c;
  --text:#e9ebff; --muted:#98a0d0; --gold:#f2c230; --green:#37c985;
  --red:#ff5d6c; --amber:#ffb020; --blue:#4d8dff; --purple:#8b6cff;
  --u:2; /* píxeles de pantalla por píxel lógico (lo fija el JS) */
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif;overflow:hidden}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.px{font-family:'Press Start 2P',ui-monospace,monospace;letter-spacing:.02em}

.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:48px minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:2px solid var(--line)}
header h1{margin:0;font-size:12px;color:var(--gold);white-space:nowrap}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--green)} .dot.off{background:var(--red);animation:blink 1s steps(2) infinite}
.pill[data-s=trabajando] .dot{background:var(--blue);animation:blink 1s steps(2) infinite}
.pill[data-s=esperando_fundador]{border-color:var(--amber);color:var(--amber)}
.pill[data-s=esperando_fundador] .dot{background:var(--amber);animation:blink .7s steps(2) infinite}
.pill[data-s=terminado] .dot{background:var(--green)} .pill[data-s=error] .dot{background:var(--red)}
@keyframes blink{50%{opacity:.25}}

/* ── Escenario ── */
.stage{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:#080915;overflow:hidden}
.board{position:relative;flex:none;box-shadow:0 0 0 3px var(--line),0 12px 40px #000a}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
.ov{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;align-items:center;gap:4px;padding:1px 5px;background:#0b0d20d9;border-radius:3px;
  font:600 calc(var(--u)*4.4px)/1.3 Inter,sans-serif;font-size:max(9px,calc(var(--u)*4.4px));color:#fff;white-space:nowrap}
.tag i{width:max(5px,calc(var(--u)*2.4px));height:max(5px,calc(var(--u)*2.4px));border-radius:50%;background:#7b82b4}
.tag i.pensando{background:var(--blue)} .tag i.en_reunion{background:var(--green)}
.tag i.esperando_aprobacion{background:var(--amber);animation:blink .7s steps(2) infinite}
.room{position:absolute;left:0;top:0;color:#ffffffb0;white-space:nowrap;font-size:max(6px,calc(var(--u)*3.6px));text-shadow:0 1px 0 #0008}
.bubble{position:absolute;left:0;top:0;max-width:calc(var(--u)*78px);min-width:calc(var(--u)*30px);padding:max(5px,calc(var(--u)*2.4px)) max(7px,calc(var(--u)*3.2px));
  background:#fff;color:#14162e;border-radius:6px;border:2px solid #14162e;font-size:max(10px,calc(var(--u)*4.6px));line-height:1.35;
  box-shadow:0 3px 0 #0006;animation:pop .15s ease-out;transition:opacity .3s}
.bubble::after{content:'';position:absolute;left:50%;bottom:-8px;width:10px;height:10px;background:#fff;border-right:2px solid #14162e;border-bottom:2px solid #14162e;
  transform:translateX(-50%) rotate(45deg) scale(.8);margin-bottom:0}
.bubble b{display:block;font-size:.8em;margin-bottom:1px}
.bubble.out{opacity:0}
@keyframes pop{from{transform:scale(.7)}}
.alert{position:absolute;left:0;top:0;padding:max(4px,calc(var(--u)*1.6px)) max(8px,calc(var(--u)*3px));border-radius:4px;color:#1a1200;font-size:max(7px,calc(var(--u)*3.2px));
  white-space:nowrap;animation:alert .7s steps(1) infinite;border:2px solid #1a1200}
@keyframes alert{0%{background:var(--gold)}50%{background:var(--red);color:#fff}}
.hidden{display:none!important}

/* Píldora y modal */
.pillbtn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:auto;padding:10px 18px;border-radius:99px;border:2px solid #1a1200;
  background:var(--gold);color:#1a1200;font-weight:600;box-shadow:0 4px 0 #0007;animation:alert 1s steps(1) infinite}
.pillbtn.calm{animation:none;background:var(--green);color:#04210f}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#05061299;pointer-events:auto;z-index:5}
.card{width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--line);border-radius:10px;box-shadow:0 0 0 3px #0008,0 20px 60px #000c}
.card.warn{border-color:var(--amber)}
.card>header{height:auto;padding:12px 16px;border-radius:8px 8px 0 0;gap:10px}
.card h2{margin:0;font-size:11px;line-height:1.6;color:var(--gold);flex:1}
.card .body{padding:14px 18px;overflow:auto;min-height:0}
.card .foot{padding:12px 16px;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.alertbox{background:#3a2a05;border:1px solid var(--amber);border-radius:6px;padding:8px 12px;color:#ffd78a;margin-bottom:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{white-space:nowrap;border:2px solid #0006;border-radius:6px;padding:9px 16px;font-weight:600;background:var(--panel2);box-shadow:0 3px 0 #0007;transition:transform .05s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0007}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ok{background:var(--green);color:#04210f} .btn.warn{background:var(--amber);color:#2b1a00} .btn.bad{background:var(--red);color:#2a040a}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--muted)}
.btn.arm{outline:3px solid #fff}
textarea{width:100%;resize:vertical;min-height:64px;background:#0d1028;border:1px solid var(--line);border-radius:6px;padding:9px 11px}
textarea::placeholder{color:#6f77a8}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px}
.tab[aria-selected=true]{background:var(--purple);border-color:var(--purple);color:#fff}

/* Markdown */
.md h3,.md h4,.md h5{margin:14px 0 6px;color:var(--gold);font-size:14px}
.md p{margin:6px 0} .md ul,.md ol{margin:6px 0;padding-left:20px} .md li{margin:2px 0}
.md code{background:#0d1028;padding:1px 5px;border-radius:4px;font-size:.9em}
.md table{border-collapse:collapse;margin:8px 0;font-size:13px;width:100%}
.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top} .md th{background:var(--panel2)}
.md hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.md>:first-child{margin-top:0}
.sec{margin:0 0 4px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-top:14px}

/* ── Panel lateral ── */
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:2px solid var(--line)}
.chat{flex:1;min-height:0;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{max-width:94%;padding:9px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);align-self:flex-start}
.msg .who{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;margin-bottom:3px;color:var(--c)}
.msg .who i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.msg.me{align-self:flex-end;background:#3a3010;border-color:#6d5a14}
.msg.me .who{justify-content:flex-end}
.msg.me .md{white-space:pre-wrap}
.empty{margin:auto 0;color:var(--muted);text-align:center;padding:10px}
.empty h3{margin:0 0 8px;color:var(--text);font-size:15px}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.chip{text-align:left;padding:8px 12px;border-radius:8px;border:1px dashed var(--line);background:transparent;color:var(--muted)}
.chip:hover{border-color:var(--purple);color:var(--text)}
.typing{align-self:flex-start;color:var(--muted);font-size:12px;padding:2px 4px}
.typing::after{content:'…';animation:blink 1s steps(2) infinite}
.compose{padding:12px 14px 14px;border-top:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.compose .row{display:flex;gap:8px;align-items:center}
.compose .row .sp{flex:1}
.hint{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--red);color:#fff;padding:10px 16px;border-radius:8px;z-index:20;max-width:90vw;box-shadow:0 6px 20px #000a}

@media (max-width:900px){
  body{overflow:auto}
  .app{display:block;height:auto}
  .stage{height:62vw;min-height:260px}
  aside{height:90vh;border-left:0;border-top:2px solid var(--line)}
  header h1{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.alert{background:var(--gold)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="px">OFICINA PEWMATIC</h1>
    <span class="sp"></span>
    <span class="pill" id="conn"><i class="dot off"></i><span>Conectando…</span></span>
    <span class="pill" id="status" data-s="libre"><i class="dot"></i><span>Oficina libre</span></span>
  </header>

  <main class="stage" id="stage">
    <div class="board" id="board">
      <canvas id="cv" width="480" height="300" aria-label="Oficina virtual animada con los agentes"></canvas>
      <div class="ov" id="ov"></div>
    </div>
    <div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle"></div>
    <button class="pillbtn hidden" id="pill"></button>
  </main>

  <aside>
    <div class="chat" id="chat" role="log" aria-live="polite"></div>
    <form class="compose" id="form">
      <textarea id="idea" rows="3" placeholder="Cuéntale tu idea al CPO…"></textarea>
      <div class="row">
        <span class="hint" id="hint"></span><span class="sp"></span>
        <button type="button" class="btn ghost" id="reset">Reiniciar</button>
        <button type="submit" class="btn ok" id="go">Entregar idea</button>
      </div>
    </form>
  </aside>
</div>

<script>
'use strict';
/* ═════════════════════════ Configuración ═════════════════════════ */
const $ = s => document.querySelector(s);
const BASE = location.protocol === 'file:' ? 'http://localhost:8000' : '';
const WS_URL = (BASE ? 'ws://localhost:8000' : (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host) + '/ws';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const AG = {
  cpo:        {name:'CPO',       full:'Director de Innovación', color:'#8b6cff', shirt:'#6b4fe0', hair:'#2b1d4a', skin:'#f1c9a5', acc:'tie'},
  viabilidad: {name:'Viabilidad',full:'Analista de Viabilidad', color:'#37c985', shirt:'#25a56a', hair:'#5a3a1e', skin:'#e0b08a', acc:'glasses'},
  tecnico:    {name:'Técnico',   full:'Arquitecto Técnico',     color:'#4d8dff', shirt:'#2f6fe0', hair:'#1b1b1b', skin:'#c98e66', acc:'headset'},
  marketing:  {name:'Marketing', full:'Marketing y Crecimiento',color:'#ff6fa5', shirt:'#e0487f', hair:'#b0442a', skin:'#f4d2b4', acc:'long'},
  fundador:   {name:'Fundador (tú)', full:'Fundador',           color:'#f2c230', shirt:'#2a2f55', hair:'#3a2a1a', skin:'#e8bd98', acc:'crown'},
};
const IDS = ['cpo','viabilidad','tecnico','marketing'];
const EJEMPLOS = [
  'Una app para que fontaneros y electricistas hagan presupuestos y facturas desde el móvil',
  'Un servicio de suscripción de menús semanales para deportistas en España',
  'Una plataforma para que academias pequeñas gestionen alumnos y cobros',
];

/* ═════════════════════════ Geometría de la oficina (px lógicos 480×300) ═════════════════════════ */
const W = 480, H = 300;
const DESK_X = {cpo:70, viabilidad:185, tecnico:300, marketing:415};
const SALA = {                                   // asientos de la sala de brainstorming
  cpo:        {x:276,y:90, face:'right', via:[]},
  viabilidad: {x:340,y:64, face:'down',  via:[[250,58]]},
  tecnico:    {x:404,y:90, face:'left',  via:[[404,130]]},
  marketing:  {x:340,y:118,face:'up',    via:[]},
};
const FUND = {cpo:[34,94], viabilidad:[58,106], tecnico:[86,94], marketing:[110,106]};   // de pie ante el escritorio del Fundador
const CORR = 165, DOOR_F = 72, DOOR_S = 185, ENTRY_Y = 130;

function locPoint(id, key){
  if (key === 'desk') return {x:DESK_X[id]-9, y:238, face:'down', seated:true};
  if (key === 'sala') return {...SALA[id], seated:true};
  return {x:FUND[id][0], y:FUND[id][1], face:'up', seated:false};
}

/* ═════════════════════════ Estado ═════════════════════════ */
const S = {
  agentes:{}, chat:[], pendiente:null, estado:'libre', final:null, conectado:false,
  minimizado:false, verFinal:true, tab:null, primerSnapshot:true, error:null,
};
const A = {};   // entidades animadas
IDS.forEach(id => { const p = locPoint(id,'desk'); A[id] = {id, x:p.x, y:p.y, dir:'down', seated:true, path:[], loc:'desk', estado:'inactivo', walk:0, bubble:null}; });

function targetLoc(a, estado){
  if (estado === 'en_reunion') return 'sala';
  if (estado === 'esperando_aprobacion') return 'fund';
  if (estado === 'pensando') return a.loc === 'sala' ? 'sala' : 'desk';   // piensa donde está si ya está en la reunión
  return 'desk';
}
function zoneOf(a){ return a.y >= 178 ? 'desk' : a.y >= 146 ? 'cor' : a.x < 140 ? 'fund' : 'sala'; }

function route(a, key){
  const pts = [], z = zoneOf(a);
  if (z === 'desk') pts.push([a.x, CORR]);
  else if (z === 'fund') pts.push([DOOR_F, ENTRY_Y], [DOOR_F, CORR]);
  else if (z === 'sala') pts.push(...[...SALA[a.id].via].reverse(), [DOOR_S, ENTRY_Y], [DOOR_S, CORR]);
  const t = locPoint(a.id, key);
  if (key === 'desk') pts.push([t.x, CORR], [t.x, t.y]);
  else if (key === 'fund') pts.push([DOOR_F, CORR], [DOOR_F, ENTRY_Y], [t.x, t.y]);
  else pts.push([DOOR_S, CORR], [DOOR_S, ENTRY_Y], ...SALA[a.id].via, [t.x, t.y]);
  return pts.filter((p,i) => !i || p[0] !== pts[i-1][0] || p[1] !== pts[i-1][1]);
}

function setEstado(id, estado, teleport){
  const a = A[id]; if (!a) return;
  a.estado = estado;
  const key = targetLoc(a, estado);
  if (key === a.loc && !teleport) return;
  a.loc = key;
  const t = locPoint(id, key);
  a.face = t.face;
  if (teleport){ Object.assign(a, {x:t.x, y:t.y, path:[], seated:t.seated, dir:t.face}); return; }
  a.seated = false;
  a.path = route(a, key);
  a.arrive = t;
}

function update(dt){
  for (const id of IDS){
    const a = A[id];
    if (!a.path.length) continue;
    let budget = 46 * dt;
    while (budget > 0 && a.path.length){
      const [tx, ty] = a.path[0], dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy);
      if (d <= budget){ a.x = tx; a.y = ty; a.path.shift(); budget -= d; }
      else { a.x += dx/d*budget; a.y += dy/d*budget; budget = 0; }
      if (d > .01) a.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    }
    a.walk += dt;
    if (!a.path.length){ a.seated = a.arrive.seated; a.dir = a.arrive.face; a.x = a.arrive.x; a.y = a.arrive.y; }
  }
}

/* ═════════════════════════ Dibujo pixel-art HD (3× → 1440×900) ═════════════════════════
   Las posiciones de la lógica siguen en el espacio 480×300; el lienzo tiene K puntos por unidad,
   así que los sprites y muebles se dibujan con 3× más detalle. */
const K = 3;
const cv = $('#cv'), ctx = cv.getContext('2d');
cv.width = W*K; cv.height = H*K;
const bg = document.createElement('canvas'); bg.width = W*K; bg.height = H*K;
let g = ctx;
const P0 = (x,y,w,h,c) => { g.fillStyle = c; g.fillRect(x,y,w,h); };                          // coordenadas en puntos
const R  = (x,y,w,h,c) => P0(Math.round(x*K),Math.round(y*K),Math.round(w*K),Math.round(h*K),c); // coordenadas lógicas
function Ed(cx,cy,rx,ry,c){ g.fillStyle = c; for (let dy=-ry; dy<=ry; dy++){ const h = Math.round(rx*Math.sqrt(1-dy*dy/(ry*ry+.01))); g.fillRect(cx-h,cy+dy,h*2,1); } }
const E = (cx,cy,rx,ry,c) => Ed(Math.round(cx*K),Math.round(cy*K),Math.round(rx*K),Math.round(ry*K),c);
const _sh = {};
function sh(hex,a){ const k = hex+a; if (_sh[k]) return _sh[k]; const n = parseInt(hex.slice(1),16); let r = n>>16, gr = (n>>8)&255, b = n&255;
  const t = a<0 ? 0 : 255, f = Math.abs(a); r = Math.round(r+(t-r)*f); gr = Math.round(gr+(t-gr)*f); b = Math.round(b+(t-b)*f);
  return _sh[k] = '#' + ((1<<24)+(r<<16)+(gr<<8)+b).toString(16).slice(1); }
function mulberry(a){ return () => { a |= 0; a = a+0x6D2B79F5|0; let t = Math.imul(a^a>>>15,1|a); t = t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ── Decorado estático ── */
function plantHD(x,y){ const X = Math.round(x*K), Y = Math.round(y*K);
  Ed(X,Y,15,5,'rgba(0,0,0,.25)');
  P0(X-12,Y-18,24,18,'#9a5530'); P0(X-14,Y-21,28,5,'#b86d40'); P0(X-14,Y-21,28,1,'#d98a58'); P0(X+6,Y-16,6,16,'#7f4426'); P0(X-11,Y-20,22,2,'#3a2615');
  Ed(X,Y-36,19,15,'#1c6e3f'); Ed(X-9,Y-42,10,12,'#24844a'); Ed(X+9,Y-40,10,12,'#24844a'); Ed(X,Y-48,9,11,'#2fa05b');
  Ed(X-6,Y-47,3,5,'#58dd90'); Ed(X+8,Y-44,2,4,'#58dd90'); P0(X-1,Y-34,2,14,'#1c6e3f'); }
function chairDesk(sx,sy){ const X = Math.round(sx*K), Y = Math.round(sy*K);
  P0(X-20,Y-44,40,36,'#2b2f52'); P0(X-18,Y-44,36,3,'#4d5390'); P0(X-18,Y-41,36,30,'#34395f'); P0(X+8,Y-41,10,30,'#2a2e4e'); P0(X-14,Y-38,2,22,'#434a82');
  P0(X-22,Y-24,4,16,'#23264a'); P0(X+18,Y-24,4,16,'#23264a');
  Ed(X,Y-6,17,8,'#2a2e4e'); Ed(X,Y-8,16,7,'#3a3f6b'); Ed(X-4,Y-9,8,3,'#4d5390');
  P0(X-2,Y+1,4,6,'#1a1a30'); P0(X-14,Y+7,28,3,'#1a1a30'); for (const dx of [-14,-7,0,7,13]) P0(X+dx-1,Y+9,3,3,'#0e0e1c'); }
function chairRound(s){ const X = Math.round(s.x*K), Y = Math.round(s.y*K);
  Ed(X,Y-4,26,14,'rgba(0,0,0,.22)'); Ed(X,Y-12,24,13,'#242848'); Ed(X,Y-14,22,12,'#3a3f6b'); Ed(X,Y-16,17,8,'#4d5390');
  const f = s.face;
  if (f === 'right') { P0(X-31,Y-44,7,32,'#2b2f52'); P0(X-30,Y-43,2,30,'#4d5390'); }
  else if (f === 'left') { P0(X+24,Y-44,7,32,'#2b2f52'); P0(X+28,Y-43,2,30,'#23264a'); }
  else if (f === 'down') { P0(X-20,Y-44,40,8,'#2b2f52'); P0(X-20,Y-44,40,2,'#4d5390'); }
  else { P0(X-20,Y-6,40,8,'#2b2f52'); P0(X-20,Y-6,40,2,'#4d5390'); } }

/* ═════════════════════════ Utilidades ═════════════════════════ */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(src){
  const inl = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*\w])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>');
  const out = []; let list = null, para = [], tbl = [];
  const fp = () => { if (para.length){ out.push('<p>'+para.join('<br>')+'</p>'); para = []; } };
  const fl = () => { if (list){ out.push('</'+list+'>'); list = null; } };
  const ft = () => { if (tbl.length){ const rows = tbl.map(r => r.replace(/^\||\|$/g,'').split('|').map(c => inl(c.trim())));
    out.push('<table><thead><tr>'+rows[0].map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table>'); tbl = []; } };
  const all = () => { fp(); fl(); ft(); };
  for (const raw of String(src).split('\n')){
    const l = raw.trimEnd(); let m;
    if (!l.trim()){ all(); continue; }
    if (/^\s*\|.*\|\s*$/.test(l)){ fp(); fl(); if (!/^[\s|:-]+$/.test(l)) tbl.push(l.trim()); continue; }
    ft();
    if ((m = l.match(/^(#{1,6})\s+(.*)/))){ all(); const n = Math.min(5, m[1].length+2); out.push(`<h${n}>${inl(m[2])}</h${n}>`); }
    else if (/^\s*[-*•]\s+/.test(l)){ fp(); if (list !== 'ul'){ fl(); out.push('<ul>'); list = 'ul'; } out.push('<li>'+inl(l.replace(/^\s*[-*•]\s+/,''))+'</li>'); }
    else if (/^\s*\d+[.)]\s+/.test(l)){ fp(); if (list !== 'ol'){ fl(); out.push('<ol>'); list = 'ol'; } out.push('<li>'+inl(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>'); }
    else if (/^-{3,}$/.test(l.trim())){ all(); out.push('<hr>'); }
    else { fl(); para.push(inl(l)); }
  }
  all(); return out.join('');
}

async function api(path, body){
  try {
    const r = await fetch(BASE + path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body || {})});
    if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(typeof j.detail === 'string' ? j.detail : 'Error ' + r.status); }
    return true;
  } catch (e){ toast(e.message === 'Failed to fetch' ? 'No se puede contactar con el servidor.' : e.message); return false; }
}

    const pv = p.tipo === 'cambio_de_rumbo', pl = p.plan;
    t = pv ? 'CAMBIO DE RUMBO PROPUESTO' : 'APROBACIÓN DE ENFOQUE'; cls = pv ? 'warn' : '';
    body = (pv ? `<div class="alertbox"><strong>El equipo propone pivotar la idea original.</strong><br>${esc(pl.motivo_pivot || '')}</div>` : '')
      + `<div class="md">${md(pl.resumen)}</div><div class="sec">Módulos</div>${lista(pl.modulos)}<div class="sec">Riesgos</div>${lista(pl.riesgos)}`;
    foot = ACCIONES;
  } else if (p && p.entregables){
    t = 'APROBACIÓN DE ENTREGABLES'; body = tabsHtml(p.entregables); foot = ACCIONES;
  } else if (fin){
    const ok = S.final.decision === 'aprobar';
    t = ok ? 'PROYECTO APROBADO ✔' : 'PROYECTO RECHAZADO';
    body = ok ? tabsHtml(S.final.entregables || {}) : '<p>Has rechazado el proyecto. Cuando quieras, entrega una idea nueva.</p>';
    foot = '<div class="actions">' + (ok ? '<button class="btn ok" data-act="descargar">⬇ Descargar .md</button>' : '') + '<button class="btn" data-act="nuevo">Nuevo proyecto</button></div>';
  }
  const keep = nuevaVentana ? {} : { ans: $('#ans')?.value, cmt: $('#cmt')?.value, mod: !$('.modbox')?.classList.contains('hidden'), sc: modal.querySelector('.body')?.scrollTop };
  nuevaVentana = false;
  modal.innerHTML = `<div class="card ${cls}"><header><h2 class="px" id="mtitle">${t}</h2><button class="btn ghost" data-act="min" aria-label="Ver la oficina">Ver oficina</button></header>
    <div class="body">${body}</div><div class="foot">${foot}</div></div>`;
  if (keep.ans) $('#ans').value = keep.ans;
  if (keep.mod){ $('.modbox').classList.remove('hidden'); $('#cmt').value = keep.cmt || ''; }
  if (keep.sc) modal.querySelector('.body').scrollTop = keep.sc;
  (modal.querySelector('#ans') || modal.querySelector('[data-act=aprobar]') || modal.querySelector('[data-act=nuevo]'))?.focus({preventScroll:true});
}
pill.addEventListener('click', () => { S.minimizado = false; S.verFinal = true; renderModal(); });
modal.addEventListener('keydown', e => { if (e.key === 'Escape'){ S.minimizado = true; renderModal(); } if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) modal.querySelector('[data-act=responder],[data-act=enviar-mod]')?.click(); });
let armRech;
modal.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]'); if (tab){ S.tab = tab.dataset.tab; const sc = modal.querySelector('.body').scrollTop; renderModal(); modal.querySelector('.body').scrollTop = sc; return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, done = () => { S.pendiente = null; S.estado = 'trabajando'; renderStatus(); };
  if (act === 'min'){ S.minimizado = true; S.verFinal = false; renderModal(); }
  else if (act === 'responder'){ const v = $('#ans').value.trim(); if (!v) return $('#ans').focus(); b.disabled = true; (await api('/api/proyecto/respuesta', {respuesta:v})) ? done() : (b.disabled = false); }
  else if (act === 'aprobar'){ b.disabled = true; (await api('/api/proyecto/respuesta', {decision:'aprobar'})) ? done() : (b.disabled = false); }
  else if (act === 'rechazar'){
    if (!b.classList.contains('arm')){ b.classList.add('arm'); b.textContent = '¿Seguro? Pulsa otra vez'; clearTimeout(armRech); armRech = setTimeout(() => { b.classList.remove('arm'); b.textContent = '✕ Rechazar'; }, 3000); return; }
    b.disabled = true; (await api('/api/proyecto/respuesta', {decision:'rechazar'})) ? done() : (b.disabled = false);
  }
  else if (act === 'modificar'){ $('.modbox').classList.remove('hidden'); $('#cmt').focus(); }
  else if (act === 'cancelar-mod'){ $('.modbox').classList.add('hidden'); }
  else if (act === 'enviar-mod'){ const v = $('#cmt').value.trim(); if (!v) return $('#cmt').focus(); b.disabled = true; (await api('/api/proyecto/respuesta', {decision:'modificar', comentario:v})) ? done() : (b.disabled = false); }
  else if (act === 'nuevo'){ await api('/api/proyecto/reiniciar'); S.minimizado = false; $('#idea').focus(); }
  else if (act === 'descargar'){
    const ent = S.final.entregables || {};
    const txt = '# Entregables del proyecto\n\n' + Object.entries(ent).map(([id,t]) => `## ${(AG[id]||{}).full || id}\n\n${t}`).join('\n\n---\n\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], {type:'text/markdown'})); a.download = 'entregables-oficina-pewmatic.md'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
});

/* ═════════════════════════ WebSocket ═════════════════════════ */
let ws, retry = 0;
function connect(){
  ws = new WebSocket(WS_URL);
  ws.onopen = () => { retry = 0; S.conectado = true; renderStatus(); };
  ws.onclose = () => { S.conectado = false; renderStatus(); setTimeout(connect, Math.min(5000, 800 + retry++*700)); };
  ws.onerror = () => ws.close();
  ws.onmessage = ev => handle(JSON.parse(ev.data));
}
function handle(m){
  if (m.type === 'snapshot'){
    const first = S.primerSnapshot; S.primerSnapshot = false;
    Object.keys(bubbles).forEach(k => { bubbles[k].el.remove(); delete bubbles[k]; });
    m.agentes.forEach(a => { S.agentes[a.id] = a; setEstado(a.id, a.estado, first); });
    nuevaVentana = true; S.chat = m.chat; S.pendiente = m.pendiente; S.estado = m.estado; S.final = m.final;
    if (m.estado !== 'esperando_fundador' && m.estado !== 'terminado') S.minimizado = false;
    renderChat(); renderStatus();
  }
  else if (m.type === 'agente'){ setEstado(m.agente, m.estado); typing(); }
  else if (m.type === 'chat'){ S.chat.push(m); say(m.agente, m.texto); chat.querySelector('.empty')?.remove(); chat.querySelector('.typing')?.remove(); chat.append(msgEl(m)); typing(); chat.scrollTop = chat.scrollHeight; }
  else if (m.type === 'pendiente'){ nuevaVentana = true; S.pendiente = m.payload; S.estado = 'esperando_fundador'; S.minimizado = false; S.tab = null; renderStatus(); typing(); }
  else if (m.type === 'fin'){ nuevaVentana = true; S.final = {decision:m.decision, entregables:m.entregables}; S.estado = 'terminado'; S.pendiente = null; S.verFinal = true; S.minimizado = false; S.tab = null; renderStatus(); typing(); IDS.forEach(id => setEstado(id,'inactivo')); }
  else if (m.type === 'error'){ S.estado = 'error'; renderStatus(); toast('Error del servidor: ' + m.detalle); }
}

/* ═════════════════════════ Arranque ═════════════════════════ */
buildBg(); fit(); renderChat(); renderStatus(); connect(); requestAnimationFrame(frame);
document.fonts?.ready.then(() => buildBg());
</script>
